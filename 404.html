<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
    <title>404 - Page Not Found | School Alarm</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f4f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .error-card { background: #ffffff; border-radius: 24px; padding: 50px 30px; max-width: 520px; width: 100%; text-align: center; box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08); border: 1.5px solid #e2e8f0; }
        .error-code { font-size: 5rem; font-weight: 800; line-height: 1; color: #0284c7; margin-bottom: 10px; }
        .path-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #64748b; font-family: monospace; margin-bottom: 25px; word-break: break-all; }
        .btn-home { background: #0284c7; color: #ffffff; font-weight: 700; border-radius: 12px; padding: 10px 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-home:hover { background: #0369a1; color: #ffffff; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h4 class="fw-bold text-dark mb-2">Page Not Found</h4>
        <p class="text-secondary small mb-3">The requested URL does not exist or has been moved.</p>
        <div class="path-box" id="urlBox">schoolalarm.online/...</div>
        <div>
            <a href="/" class="btn-home"><i class="fas fa-home"></i> Back to Home</a>
        </div>
    </div>
    <script>
        document.getElementById('urlBox').innerText = window.location.href;
    </script>
</body>
</html>
