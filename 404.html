<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>404 - Reality Corrupted | School Alarm</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090314;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* 🌐 Layer 1: Blurred Live Website in Background */
        .site-bg-frame {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            filter: blur(8px) brightness(0.35) saturate(1.2);
            transform: scale(1.05); /* Prevents blur border edges */
            pointer-events: none;
            z-index: 1;
        }

        .dark-dimmer-layer {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(30, 11, 54, 0.6) 0%, rgba(9, 3, 20, 0.92) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* 🎮 Layer 2: Canvas Game Viewport */
        .game-viewport {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 🕹️ Layer 3: Minimalist Modern HUD Overlay */
        .hud-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
            padding: 24px 32px;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .btn-home-pill {
            pointer-events: auto;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-home-pill:hover {
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-2px);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        /* Glitch 404 Badge */
        .badge-404 {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            background: rgba(244, 63, 94, 0.2);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.4);
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .scoreboard-box {
            text-align: right;
            font-family: "Courier New", Courier, monospace;
        }

        .current-score {
            font-size: 34px;
            font-weight: 900;
            color: #f472b6;
            letter-spacing: 3px;
            line-height: 1;
            text-shadow: 0 0 12px rgba(244, 114, 182, 0.5);
        }

        .best-score {
            font-size: 11px;
            font-weight: 800;
            color: #c084fc;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Bottom Controls Bar */
        .bottom-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .jump-hint-text {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        .key-tag {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            color: #ffffff;
            font-weight: 800;
        }

        .action-tools {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-circle:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        @media (max-width: 600px) {
            .hud-overlay { padding: 16px 18px; }
            .current-score { font-size: 24px; }
            .badge-404 { display: none; }
            .jump-hint-text { font-size: 11.5px; }
        }
    </style>
</head>
<body>

    <!-- 🌐 Layer 1: Actual School Alarm Website Running Blurred in Background -->
    <iframe class="site-bg-frame" id="bgFrame" src="/"></iframe>
    <div class="dark-dimmer-layer"></div>

    <!-- 🎮 Layer 2: Pure Canvas Arcade Skater Engine -->
    <div class="game-viewport">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 🕹️ Layer 3: Clean Minimal HUD Overlay -->
    <div class="hud-overlay">
        <!-- Top Row -->
        <div class="top-hud">
            <a href="/" class="btn-home-pill">
                &#9664; Back to ERP
            </a>
            <div class="badge-404">
                404 // Dimension Lost
            </div>
            <div class="scoreboard-box">
                <div class="current-score" id="scoreDisplay">00000</div>
                <div class="best-score" id="bestScoreDisplay">BEST 00000</div>
            </div>
        </div>

        <!-- Bottom Row -->
        <div class="bottom-hud">
            <div class="jump-hint-text">
                Press <span class="key-tag">Space</span> or <span class="key-tag">Tap</span> to Jump &bull; <span class="key-tag">Double Tap</span> for Flip Jump <span class="key-tag">Powered by A2Z Online Services PVT. LTD.</span><span class="key-tag">Run by NextGen School Alert. </span>
            </div>
            <div class="action-tools">
                <button class="btn-circle" id="btnRestart" title="Restart Run">&#8635;</button>
                <button class="btn-circle" id="btnSoundToggle" title="Music & Sound Toggle">&#128266;</button>
            </div>
        </div>
    </div>

    <!-- Arcade Canvas Engine with Double-Jump & Web-Audio Synthesizer -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreDisplay");
        const bestScoreEl = document.getElementById("bestScoreDisplay");
        const soundBtn = document.getElementById("btnSoundToggle");
        const restartBtn = document.getElementById("btnRestart");

        let width = 0;
        let height = 0;
        let groundY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            groundY = height - Math.max(90, Math.floor(height * 0.16));
        }
        window.addEventListener("resize", resize);
        resize();

        // High Score
        let bestScore = parseInt(localStorage.getItem("alarm_skate_best") || "0", 10);
        bestScoreEl.innerText = "BEST " + String(bestScore).padStart(5, "0");

        // 🎵 100% Native Web Audio Synth (Music & Sound Effects - Zero MP3s required)
        let soundEnabled = true;
        let audioCtx = null;
        let musicClockInterval = null;
        const melodyNotes = [261.63, 329.63, 392.00, 523.25, 440.00, 392.00, 329.63, 293.66];
        let noteIdx = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                startBackgroundChiptune();
            }
        }

        function playJumpSound(isDoubleJump) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = isDoubleJump ? "triangle" : "square";
                const startF = isDoubleJump ? 450 : 220;
                const endF = isDoubleJump ? 900 : 540;
                osc.frequency.setValueAtTime(startF, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(endF, audioCtx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.16);
            } catch(e) {}
        }

        function playCrashSound() {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch(e) {}
        }

        function startBackgroundChiptune() {
            if (musicClockInterval) clearInterval(musicClockInterval);
            musicClockInterval = setInterval(() => {
                if (!soundEnabled || !audioCtx || !isStarted || isGameOver) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = "sine";
                    const freq = melodyNotes[noteIdx % melodyNotes.length];
                    noteIdx++;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.035, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.22);
                } catch(e) {}
            }, 260);
        }

        soundBtn.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            soundBtn.innerHTML = soundEnabled ? "&#128266;" : "&#128263;";
        });

        // Game State Variables
        let isStarted = false;
        let isGameOver = false;
        let score = 0;
        let speed = 7;
        let frame = 0;

        // Player (School Alarm Bell Mascot on Skateboard)
        const player = {
            x: 80,
            y: 0,
            w: 46,
            h: 52,
            vy: 0,
            gravity: 0.72,
            jumpStrength: -13.8,
            doubleJumpStrength: -12.0,
            jumpsRemaining: 2,
            flipAngle: 0,
            isFlipping: false
        };

        // Obstacles (School Book Stacks, Desks, Hurdle Blocks)
        let obstacles = [];
        let particles = [];
        let nextObstacleTimer = 50;

        function resetGame() {
            score = 0;
            speed = 7;
            obstacles = [];
            particles = [];
            nextObstacleTimer = 50;
            player.y = groundY - player.h;
            player.vy = 0;
            player.jumpsRemaining = 2;
            player.flipAngle = 0;
            player.isFlipping = false;
            isGameOver = false;
            isStarted = true;
            updateScoreUI();
        }

        // Jump & Double Jump Controller
        function triggerJump() {
            initAudio();
            if (!isStarted || isGameOver) {
                resetGame();
                return;
            }

            if (player.jumpsRemaining > 0) {
                const isDouble = (player.jumpsRemaining === 1);
                player.vy = isDouble ? player.doubleJumpStrength : player.jumpStrength;
                player.jumpsRemaining--;
                playJumpSound(isDouble);

                if (isDouble) {
                    player.isFlipping = true;
                    // Burst particles on double jump
                    createSparks(player.x + player.w / 2, player.y + player.h, "#38bdf8", 12);
                } else {
                    createSparks(player.x + 10, groundY, "#f59e0b", 6);
                }
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                triggerJump();
            }
        });

        window.addEventListener("touchstart", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            triggerJump();
        });

        window.addEventListener("mousedown", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            triggerJump();
        });

        restartBtn.addEventListener("click", () => resetGame());

        function updateScoreUI() {
            scoreEl.innerText = String(Math.floor(score)).padStart(5, "0");
            if (score > bestScore) {
                bestScore = Math.floor(score);
                localStorage.setItem("alarm_skate_best", String(bestScore));
                bestScoreEl.innerText = "BEST " + String(bestScore).padStart(5, "0");
            }
        }

        // Particle System for Sparks
        function createSparks(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6 - 2,
                    vy: (Math.random() - 0.7) * 5,
                    color: color,
                    life: 20
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // Draw Stylized Cyber Track / Ground
        function drawTrack() {
            ctx.fillStyle = "#110726";
            ctx.fillRect(0, groundY, width, height - groundY);

            // Glowing Track Rail Line
            const railGrad = ctx.createLinearGradient(0, 0, width, 0);
            railGrad.addColorStop(0, "#38bdf8");
            railGrad.addColorStop(0.5, "#ec4899");
            railGrad.addColorStop(1, "#38bdf8");
            ctx.fillStyle = railGrad;
            ctx.fillRect(0, groundY, width, 4);

            // Grid dashes moving with speed
            ctx.strokeStyle = "rgba(192, 132, 252, 0.25)";
            ctx.lineWidth = 1.5;
            const offset = (frame * speed) % 40;
            for (let x = -offset; x < width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, groundY + 4);
                ctx.lineTo(x - 20, height);
                ctx.stroke();
            }
        }

        // Draw Player (School Alarm Bell Mascot)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);

            // 360 Flip animation on Double Jump
            if (player.isFlipping) {
                player.flipAngle += 0.32;
                if (player.flipAngle >= Math.PI * 2) {
                    player.flipAngle = 0;
                    player.isFlipping = false;
                }
            } else if (player.jumpsRemaining < 2) {
                player.flipAngle = -0.15; // Lean back in air
            } else {
                player.flipAngle = Math.sin(frame * 0.2) * 0.04; // subtle skate vibration
            }
            ctx.rotate(player.flipAngle);

            // Bell Mascot Body (Golden Bell)
            ctx.beginPath();
            ctx.arc(0, -8, 17, Math.PI, 0, false);
            ctx.lineTo(16, 10);
            ctx.lineTo(-16, 10);
            ctx.closePath();
            ctx.fillStyle = "#facc15";
            ctx.fill();
            ctx.strokeStyle = "#ca8a04";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Crown / Top Ring
            ctx.beginPath();
            ctx.arc(0, -22, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#eab308";
            ctx.fill();
            ctx.stroke();

            // Cool Visor / Eye
            ctx.beginPath();
            ctx.roundRect(0, -6, 13, 8, 4);
            ctx.fillStyle = "#0f172a";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -2, 2, 0, Math.PI * 2);
            ctx.fillStyle = "#38bdf8";
            ctx.fill();

            // Skateboard Deck (Pink Neon)
            ctx.fillStyle = "#f43f5e";
            ctx.fillRect(-22, 16, 44, 4);
            ctx.fillStyle = "#fb7185";
            ctx.fillRect(-20, 15, 40, 1.5);

            // Wheels (Cyan Glow)
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(-14, 22, 4, 0, Math.PI * 2);
            ctx.arc(14, 22, 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Draw Dynamic Obstacles (Computer, WiFi, USB, TV, Server, Books)
        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);

            switch (obs.type) {
                case "computer":
                    // 🖥️ Desktop PC Monitor
                    ctx.fillStyle = "#1e293b";
                    ctx.fillRect(0, 0, obs.w, obs.h - 10); // Screen frame
                    ctx.fillStyle = "#38bdf8";
                    ctx.fillRect(3, 3, obs.w - 6, obs.h - 16); // Glowing screen
                    // Code lines on screen
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(6, 7, 16, 2);
                    ctx.fillRect(6, 12, 22, 2);
                    ctx.fillRect(6, 17, 12, 2);
                    // Stand & Base
                    ctx.fillStyle = "#64748b";
                    ctx.fillRect(obs.w / 2 - 3, obs.h - 10, 6, 7);
                    ctx.fillRect(obs.w / 2 - 12, obs.h - 3, 24, 3);
                    break;

                case "wifi":
                    // 📡 WiFi Router with Antennas & Glowing Signals
                    // Antennas
                    ctx.strokeStyle = "#94a3b8";
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(6, 14); ctx.lineTo(3, 0); // Left antenna
                    ctx.moveTo(obs.w - 6, 14); ctx.lineTo(obs.w - 3, 0); // Right antenna
                    ctx.stroke();
                    // Router Body
                    ctx.fillStyle = "#0f172a";
                    ctx.roundRect(0, 14, obs.w, obs.h - 14, 4);
                    ctx.fill();
                    // LED Lights
                    ctx.fillStyle = "#22c55e";
                    ctx.fillRect(5, obs.h - 6, 3, 3);
                    ctx.fillRect(11, obs.h - 6, 3, 3);
                    ctx.fillStyle = "#38bdf8";
                    ctx.fillRect(17, obs.h - 6, 3, 3);
                    // WiFi Signal Arcs in air
                    ctx.strokeStyle = "rgba(56, 189, 248, 0.8)";
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.arc(obs.w / 2, 8, 7, Math.PI * 1.2, Math.PI * 1.8);
                    ctx.stroke();
                    break;

                case "usb":
                    // 💾 USB Flash Drive
                    // Metal Connector
                    ctx.fillStyle = "#cbd5e1";
                    ctx.fillRect(5, 0, obs.w - 10, 12);
                    ctx.fillStyle = "#0f172a";
                    ctx.fillRect(8, 3, 3, 4);
                    ctx.fillRect(obs.w - 11, 3, 3, 4);
                    // Plastic Body
                    ctx.fillStyle = "#ec4899";
                    ctx.roundRect(0, 12, obs.w, obs.h - 12, 4);
                    ctx.fill();
                    // Grip Stripes
                    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                    ctx.fillRect(3, 18, obs.w - 6, 2);
                    ctx.fillRect(3, 24, obs.w - 6, 2);
                    break;

                case "tv":
                    // 📺 Smart Board / Digital Screen on Rolling Stand
                    ctx.fillStyle = "#020617";
                    ctx.fillRect(0, 0, obs.w, obs.h - 14); // Screen
                    ctx.fillStyle = "#10b981";
                    ctx.fillRect(3, 3, obs.w - 6, obs.h - 20); // Green Smartboard Display
                    // Classroom Chart Line
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(6, obs.h - 26);
                    ctx.lineTo(14, obs.h - 32);
                    ctx.lineTo(24, obs.h - 28);
                    ctx.lineTo(34, obs.h - 34);
                    ctx.stroke();
                    // Wheels Stand
                    ctx.fillStyle = "#475569";
                    ctx.fillRect(obs.w / 2 - 3, obs.h - 14, 6, 10);
                    ctx.fillRect(4, obs.h - 4, obs.w - 8, 4);
                    break;

                case "server":
                    // 🖧 ERP Cloud Server Rack
                    ctx.fillStyle = "#1e1b4b";
                    ctx.roundRect(0, 0, obs.w, obs.h, 3);
                    ctx.fill();
                    // Server Blade Slots
                    ctx.fillStyle = "#312e81";
                    for (let y = 4; y < obs.h - 6; y += 9) {
                        ctx.fillRect(3, y, obs.w - 6, 6);
                        // Blinking Server LEDs
                        ctx.fillStyle = (Math.random() > 0.3) ? "#22c55e" : "#ef4444";
                        ctx.fillRect(6, y + 2, 2.5, 2.5);
                        ctx.fillStyle = "#38bdf8";
                        ctx.fillRect(11, y + 2, 2.5, 2.5);
                        ctx.fillStyle = "#312e81";
                    }
                    break;

                default:
                case "books":
                    // 📚 School Books Stack
                    const bookColors = ["#ef4444", "#3b82f6", "#10b981", "#8b5cf6", "#f59e0b"];
                    const layerH = Math.floor(obs.h / obs.layers);
                    for (let i = 0; i < obs.layers; i++) {
                        const by = obs.h - (i + 1) * layerH;
                        ctx.fillStyle = bookColors[i % bookColors.length];
                        ctx.fillRect(0, by, obs.w, layerH - 1);
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(2, by + 1, 3, layerH - 3);
                    }
                    break;
            }

            ctx.restore();
        }

        // Game Over Banner
        function drawGameOver() {
            ctx.save();
            ctx.fillStyle = "rgba(9, 3, 20, 0.82)";
            ctx.fillRect(0, 0, width, height);

			ctx.textAlign = "center";
            ctx.fillStyle = "#f43f5e";
            ctx.font = "900 clamp(32px, 6vw, 56px) sans-serif";
            ctx.shadowColor = "#3664B5";
            ctx.shadowBlur = 25;
            ctx.fillText("GAME OVER", width / 2, height / 2 - 100);
            ctx.shadowBlur = 0;

            ctx.textAlign = "center";
            ctx.fillStyle = "#f43f5e";
            ctx.font = "900 clamp(25px, 6vw, 50px) sans-serif";
            ctx.shadowColor = "#3664B5";
            ctx.shadowBlur = 25;
            ctx.fillText("Powered by : NextGen School alert", width / 2, height / 2 - 20);
            ctx.shadowBlur = 0;

            ctx.fillStyle = "#ffffff";
            ctx.font = "700 16px sans-serif";
            ctx.fillText("Tap or Press Space to Restart Run", width / 2, height / 2 + 20);

            ctx.fillStyle = "#fde047";
            ctx.font = "800 15px monospace";
            ctx.fillText(`SCORE: ${Math.floor(score)}  |  BEST: ${bestScore}`, width / 2, height / 2 + 55);
            ctx.restore();
        }

        // Main Loop
        function loop() {
            frame++;
            ctx.clearRect(0, 0, width, height);

            drawTrack();

            if (!isStarted) {
                player.y = groundY - player.h;
                drawPlayer();
                requestAnimationFrame(loop);
                return;
            }

            if (!isGameOver) {
                // Physics
                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundY - player.h) {
                    player.y = groundY - player.h;
                    player.vy = 0;
                    player.jumpsRemaining = 2; // Reset Double Jump
                    player.isFlipping = false;
                }

                // Progressive Score & Speed
                score += 0.22;
                speed = Math.min(14, 7 + (score * 0.006)); // Speed ramps up smoothly
                updateScoreUI();

                // Spawn Random ERP & Tech Obstacles
                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    const itemTypes = ["computer", "wifi", "usb", "tv", "server", "books"];
                    const chosen = itemTypes[Math.floor(Math.random() * itemTypes.length)];

                    let obsW = 32;
                    let obsH = 42;
                    let layers = 3;

                    if (chosen === "computer") {
                        obsW = 36;
                        obsH = 44;
                    } else if (chosen === "wifi") {
                        obsW = 34;
                        obsH = 38;
                    } else if (chosen === "usb") {
                        obsW = 20;
                        obsH = 36;
                    } else if (chosen === "tv") {
                        obsW = 46;
                        obsH = 48; // Tall hurdle (needs Double Jump!)
                    } else if (chosen === "server") {
                        obsW = 30;
                        obsH = 46;
                    } else if (chosen === "books") {
                        layers = 2 + Math.floor(Math.random() * 3);
                        obsW = 28;
                        obsH = layers * 12;
                    }

                    obstacles.push({
                        x: width + 20,
                        y: groundY - obsH,
                        w: obsW,
                        h: obsH,
                        type: chosen,
                        layers: layers
                    });

                    // Distance between hurdles adjusts automatically as speed increases
                    nextObstacleTimer = Math.floor(50 + Math.random() * 55 - (speed * 1.6));
                }

                // Move & Collision Check
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= speed;
                    drawObstacle(obs);

                    // Tight Hitbox Collision
                    const px = player.x + 8;
                    const py = player.y + 6;
                    const pw = player.w - 16;
                    const ph = player.h - 10;

                    if (
                        px < obs.x + obs.w &&
                        px + pw > obs.x &&
                        py < obs.y + obs.h &&
                        py + ph > obs.y
                    ) {
                        isGameOver = true;
                        playCrashSound();
                        createSparks(player.x + player.w / 2, player.y + player.h / 2, "#f43f5e", 25);
                    }

                    if (obs.x + obs.w < -30) {
                        obstacles.splice(i, 1);
                    }
                }

                updateAndDrawParticles();
                drawPlayer();
            } else {
                for (let obs of obstacles) drawObstacle(obs);
                updateAndDrawParticles();
                drawPlayer();
                drawGameOver();
            }

            requestAnimationFrame(loop);
        }

        // Initialize Engine
        resetGame();
        isStarted = false; // Waiting for first Jump key
        loop();
    </script>
</body>
</html>
