<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>404 - Wrong Turn | School Alarm</title>
    
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1e0b36;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Header Navigation */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 32px;
            z-index: 20;
        }

        .btn-back-home {
            color: #e9d5ff;
            text-decoration: none;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .btn-back-home:hover {
            color: #ffffff;
            transform: translateX(-3px);
        }

        /* Score Display */
        .score-board {
            text-align: right;
            font-family: "Courier New", Courier, monospace;
        }

        .current-score {
            font-size: 32px;
            font-weight: 900;
            color: #f472b6;
            letter-spacing: 3px;
            line-height: 1;
        }

        .best-score {
            font-size: 11px;
            font-weight: 800;
            color: #c084fc;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Headings & Captions */
        .header-content {
            text-align: center;
            z-index: 20;
            padding: 0 16px;
            margin-top: -10px;
        }

        .title-main {
            font-size: clamp(2rem, 5.5vw, 4.2rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.05;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .title-accent {
            color: #f472b6;
            display: block;
            margin-top: 4px;
        }

        .subtitle {
            margin-top: 14px;
            font-size: clamp(12px, 1.6vw, 15px);
            color: #cbd5e1;
            font-weight: 500;
            line-height: 1.5;
        }

        .highlight-text {
            color: #fde047;
            font-weight: 700;
        }

        /* Canvas Game Viewport */
        .game-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Bottom Controls Bar */
        .bottom-bar {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px 24px 32px;
        }

        .control-hint {
            font-size: 12px;
            font-weight: 600;
            color: #d8b4fe;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }

        .right-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.08);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .top-bar { padding: 16px 20px; }
            .bottom-bar { padding: 12px 20px 18px 20px; }
            .current-score { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- Canvas Game Plane (Runs offline, self-contained) -->
    <div class="game-wrapper">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Top Navigation Bar -->
    <header class="top-bar">
        <a href="/" class="btn-back-home">
            &#9664; Back Home
        </a>
        <div class="score-board">
            <div class="current-score" id="scoreDisplay">00000</div>
            <div class="best-score" id="bestScoreDisplay">BEST 00000</div>
        </div>
    </header>

    <!-- Header Description Overlay -->
    <div class="header-content">
        <h1 class="title-main">
            Oops, Wrong Turn.
            <span class="title-accent">Quick Sesh?</span>
        </h1>
        <p class="subtitle">
            You've landed somewhere unexpected.<br/>
            <span class="highlight-text">Tap or press Space to skate</span>, jump hurdles, and chase a new high score.
        </p>
    </div>

    <!-- Bottom Controls & Sound Toggle -->
    <footer class="bottom-bar">
        <div class="control-hint">
            Press <span class="key-badge">Space</span> or <span class="key-badge">Tap</span> to jump
        </div>
        <div class="right-buttons">
            <button class="btn-icon" id="btnRestart" title="Restart Game">
                &#8635;
            </button>
            <button class="btn-icon" id="btnSoundToggle" title="Toggle Sound">
                &#128266;
            </button>
        </div>
    </footer>

    <!-- Complete Self-Contained 2D Runner Game Engine -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("scoreDisplay");
        const bestScoreEl = document.getElementById("bestScoreDisplay");
        const soundBtn = document.getElementById("btnSoundToggle");
        const restartBtn = document.getElementById("btnRestart");

        let width = 0;
        let height = 0;
        let groundY = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            groundY = height - Math.max(90, Math.floor(height * 0.16));
        }
        window.addEventListener("resize", resize);
        resize();

        // High Score
        let bestScore = parseInt(localStorage.getItem("skate_404_best") || "0", 10);
        bestScoreEl.innerText = "BEST " + String(bestScore).padStart(5, "0");

        // Web Audio Synthesizer (Zero External Audio Files Needed)
        let soundEnabled = true;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(freqStart, freqEnd, type, duration) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        soundBtn.addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            soundBtn.innerHTML = soundEnabled ? "&#128266;" : "&#128263;";
        });

        // Game State Variables
        let isStarted = false;
        let isGameOver = false;
        let score = 0;
        let speed = 6;
        let frame = 0;

        // Player (Skater Bell Character)
        const player = {
            x: 80,
            y: 0,
            w: 44,
            h: 52,
            vy: 0,
            gravity: 0.72,
            jumpStrength: -14.5,
            isGrounded: true,
            skateAngle: 0
        };

        // Obstacles (Cones, Blocks, Hurdle Cones)
        let obstacles = [];
        let nextObstacleTimer = 60;

        // Background City Silhouettes
        let cityScroll = 0;

        function resetGame() {
            score = 0;
            speed = 6.5;
            obstacles = [];
            nextObstacleTimer = 50;
            player.y = groundY - player.h;
            player.vy = 0;
            player.isGrounded = true;
            isGameOver = false;
            isStarted = true;
            updateScoreUI();
        }

        function jump() {
            initAudio();
            if (!isStarted) {
                resetGame();
                return;
            }
            if (isGameOver) {
                resetGame();
                return;
            }
            if (player.isGrounded) {
                player.vy = player.jumpStrength;
                player.isGrounded = false;
                playSound(240, 580, "square", 0.16);
            }
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                jump();
            }
        });

        window.addEventListener("touchstart", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            jump();
        });

        window.addEventListener("mousedown", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            jump();
        });

        restartBtn.addEventListener("click", () => {
            resetGame();
        });

        function updateScoreUI() {
            scoreEl.innerText = String(Math.floor(score)).padStart(5, "0");
            if (score > bestScore) {
                bestScore = Math.floor(score);
                localStorage.setItem("skate_404_best", String(bestScore));
                bestScoreEl.innerText = "BEST " + String(bestScore).padStart(5, "0");
            }
        }

        // Draw Background Sunset & City Skyline
        function drawBackground() {
            // Sunset Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
            skyGrad.addColorStop(0, "#240046");
            skyGrad.addColorStop(0.4, "#5a189a");
            skyGrad.addColorStop(0.75, "#9d4edd");
            skyGrad.addColorStop(1, "#f77f00");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, width, groundY);

            // Glowing Sun
            ctx.beginPath();
            ctx.arc(width * 0.65, groundY - 30, 60, 0, Math.PI * 2);
            ctx.fillStyle = "#ffb703";
            ctx.shadowColor = "#fb8500";
            ctx.shadowBlur = 40;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Distant City Skyline (Silhouettes)
            cityScroll = (cityScroll + (isStarted && !isGameOver ? speed * 0.25 : 0.8)) % 600;
            ctx.fillStyle = "#1b0a2a";

            for (let i = -1; i < Math.ceil(width / 70) + 3; i++) {
                const bHeight = 120 + ((i * 37) % 110);
                const bx = (i * 70) - (cityScroll % 70);
                ctx.fillRect(bx, groundY - bHeight, 58, bHeight);
                // Roof spikes / angles on some buildings
                if (i % 2 === 0) {
                    ctx.beginPath();
                    ctx.moveTo(bx, groundY - bHeight);
                    ctx.lineTo(bx + 29, groundY - bHeight - 24);
                    ctx.lineTo(bx + 58, groundY - bHeight);
                    ctx.fill();
                }
            }

            // Dark Foreground Sidewalk & Street
            const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
            groundGrad.addColorStop(0, "#2d004b");
            groundGrad.addColorStop(1, "#0d0117");
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, width, height - groundY);

            // Sidewalk Curbs
            ctx.fillStyle = "#a855f7";
            ctx.fillRect(0, groundY, width, 4);

            ctx.fillStyle = "#581c87";
            ctx.fillRect(0, groundY + 4, width, 8);
        }

        // Draw Stylized Skater (School Alarm Character)
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);

            // Tilt skateboard slightly while in air
            if (!player.isGrounded) {
                player.skateAngle = Math.sin(frame * 0.15) * 0.2;
            } else {
                player.skateAngle = 0;
            }
            ctx.rotate(player.skateAngle);

            // Character Head / Bell Body
            ctx.beginPath();
            ctx.arc(0, -10, 18, Math.PI, 0, false);
            ctx.lineTo(16, 8);
            ctx.lineTo(-16, 8);
            ctx.closePath();
            ctx.fillStyle = "#eab308";
            ctx.fill();
            ctx.strokeStyle = "#ca8a04";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Beanie / Cap
            ctx.fillStyle = "#f97316";
            ctx.fillRect(-12, -26, 24, 7);
            ctx.beginPath();
            ctx.arc(0, -26, 6, 0, Math.PI * 2);
            ctx.fill();

            // Big Animated Cartoon Eye
            ctx.beginPath();
            ctx.arc(4, -4, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6, -4, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = "#0f172a";
            ctx.fill();

            // Shoes
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(-14, 10, 12, 6);
            ctx.fillRect(4, 10, 12, 6);

            // Skateboard Deck
            ctx.fillStyle = "#ec4899";
            ctx.fillRect(-24, 16, 48, 4);
            ctx.strokeStyle = "#db2777";
            ctx.lineWidth = 1;
            ctx.strokeRect(-24, 16, 48, 4);

            // Skateboard Wheels
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath();
            ctx.arc(-16, 22, 3.5, 0, Math.PI * 2);
            ctx.arc(16, 22, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Obstacles (Street Cone Hurdles)
        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);

            // Traffic Warning Cone (Orange / Yellow)
            ctx.beginPath();
            ctx.moveTo(obs.w / 2, 0);
            ctx.lineTo(obs.w, obs.h);
            ctx.lineTo(0, obs.h);
            ctx.closePath();
            ctx.fillStyle = "#f97316";
            ctx.fill();

            // Reflective White Band on Cone
            ctx.beginPath();
            ctx.moveTo(obs.w * 0.28, obs.h * 0.55);
            ctx.lineTo(obs.w * 0.72, obs.h * 0.55);
            ctx.lineTo(obs.w * 0.82, obs.h * 0.75);
            ctx.lineTo(obs.w * 0.18, obs.h * 0.75);
            ctx.closePath();
            ctx.fillStyle = "#ffffff";
            ctx.fill();

            // Base
            ctx.fillStyle = "#ea580c";
            ctx.fillRect(-4, obs.h - 3, obs.w + 8, 4);

            ctx.restore();
        }

        // Draw Game Over Banner on Canvas
        function drawGameOverOverlay() {
            ctx.save();
            ctx.fillStyle = "rgba(15, 7, 28, 0.75)";
            ctx.fillRect(0, 0, width, height);

            ctx.textAlign = "center";
            ctx.fillStyle = "#f43f5e";
            ctx.font = "900 42px Poppins, sans-serif";
            ctx.fillText("CRASHED!", width / 2, height / 2 - 20);

            ctx.fillStyle = "#ffffff";
            ctx.font = "600 16px Poppins, sans-serif";
            ctx.fillText("Press Space or Tap to retry", width / 2, height / 2 + 20);

            ctx.fillStyle = "#fde047";
            ctx.font = "700 14px monospace";
            ctx.fillText(`SCORE: ${Math.floor(score)}  |  BEST: ${bestScore}`, width / 2, height / 2 + 55);
            ctx.restore();
        }

        // Main Animation Loop
        function loop() {
            frame++;
            drawBackground();

            if (!isStarted) {
                player.y = groundY - player.h;
                drawPlayer();
                requestAnimationFrame(loop);
                return;
            }

            if (!isGameOver) {
                // Physics Update
                player.vy += player.gravity;
                player.y += player.vy;

                if (player.y >= groundY - player.h) {
                    player.y = groundY - player.h;
                    player.vy = 0;
                    player.isGrounded = true;
                }

                // Score & Speed Progression
                score += 0.18;
                speed = Math.min(13, 6.5 + (score * 0.005));
                updateScoreUI();

                // Spawn Obstacles
                nextObstacleTimer--;
                if (nextObstacleTimer <= 0) {
                    const obsHeight = 36 + Math.floor(Math.random() * 18);
                    const obsWidth = 24 + Math.floor(Math.random() * 12);
                    obstacles.push({
                        x: width + 20,
                        y: groundY - obsHeight,
                        w: obsWidth,
                        h: obsHeight
                    });
                    nextObstacleTimer = Math.floor(65 + Math.random() * 70 - (speed * 2));
                }

                // Move & Render Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.x -= speed;
                    drawObstacle(obs);

                    // AABB Collision Detection
                    const px = player.x + 8;
                    const py = player.y + 4;
                    const pw = player.w - 16;
                    const ph = player.h - 8;

                    if (
                        px < obs.x + obs.w &&
                        px + pw > obs.x &&
                        py < obs.y + obs.h &&
                        py + ph > obs.y
                    ) {
                        isGameOver = true;
                        playSound(120, 40, "sawtooth", 0.35);
                    }

                    // Remove off-screen obstacles
                    if (obs.x + obs.w < -20) {
                        obstacles.splice(i, 1);
                    }
                }

                drawPlayer();
            } else {
                // Game Over state
                for (let obs of obstacles) {
                    drawObstacle(obs);
                }
                drawPlayer();
                drawGameOverOverlay();
            }

            requestAnimationFrame(loop);
        }

        // Initial Boot
        resetGame();
        isStarted = false; // Wait for initial space/tap
        loop();
    </script>
</body>
</html>
